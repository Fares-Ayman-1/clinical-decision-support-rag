# Single public port for the whole stack (HF Spaces exposes exactly one).
# nginx serves the built React bundle and reverse-proxies /api/ to uvicorn on
# loopback, so the browser talks to ONE origin — that is what keeps the
# backend's CORS policy (NFR-3.4) from mattering here at all: the request is
# same-origin, so no preflight is issued and no wildcard is ever needed.
server {
  listen 7860;
  listen [::]:7860;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Mirrors frontend/nginx.conf — kept in sync deliberately.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # No X-Frame-Options at all, deliberately. A Space is framed by
  # huggingface.co/spaces/... while the app is served from *.hf.space -- a
  # DIFFERENT origin -- so both "DENY" and "SAMEORIGIN" blank the embedded
  # view ("Refused to display ... in a frame"). X-Frame-Options has no
  # working allow-list form: ALLOW-FROM was never implemented by Chrome and
  # was dropped everywhere else. CSP frame-ancestors is the replacement that
  # browsers actually honor, so clickjacking protection is expressed there
  # instead -- still a real restriction, just one that names the HF parent.
  add_header Content-Security-Policy "frame-ancestors 'self' https://huggingface.co https://*.hf.space" always;

  # Was 64k when the API only took JSON symptom text. /api/transcribe now
  # accepts recorded audio (~100-200 KB per 10 s of opus; the backend enforces
  # its own 15 MB cap), so the proxy limit moves to match the backend's.
  client_max_body_size 16m;

  # The two backends share the /api prefix. Clinical endpoints are routed by
  # EXACT prefix to uvicorn; everything else under /api/ (exercises, sessions,
  # schedule, einstein, admin) belongs to the faqarati Express API on :3000.
  # ^~ beats the generic /api/ prefix match, so ordering here is explicit
  # rather than accidental.
  location ^~ /api/query { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 180s; proxy_send_timeout 180s; proxy_buffering off; }
  location ^~ /api/transcribe { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 180s; proxy_send_timeout 180s; proxy_buffering off; }
  location ^~ /api/health { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; }
  location ^~ /api/evidence { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; }
  location ^~ /api/care-directory { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; }

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /unused-api-block/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # EVALUATION.md §10.7 records p95 latency well past the 8 s budget, and a
    # cold reranker adds ~80 s on the first call. nginx's 60 s default would
    # turn those into 504s that look like backend bugs.
    proxy_connect_timeout 15s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;
    proxy_buffering off;
  }

  location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
