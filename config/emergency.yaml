# Emergency contact information — SPEC.md SAF-6.5.
#
# Emergency numbers MUST come from configuration, never from the LLM. A
# hallucinated emergency number is among the highest-severity failures
# this system could produce, so the number is never generated, never
# retrieved, and never passed through a prompt — it is read from here and
# injected by the server.
#
# SAF-6.6/6.7: the system MUST NOT place a call or send a message
# autonomously, and every external action requires explicit user
# confirmation. This file supplies DISPLAY text only. Nothing in the
# codebase dials, and no response schema field can trigger a side effect
# (SAF-9.4).

# The deployment's locale. This deployment targets Egypt: the فقراتي UI,
# the care directory (data/care_directory.json), and every CTA already use
# the Egyptian ambulance number 123, so the config matches them — a
# generic "your local emergency number" next to buttons that dial 123
# would be the inconsistency, not the safety.
default_locale: "eg"

# `*_ar` keys are Arabic display variants, selected when the question was
# asked in Arabic; English is the fallback whenever a translation is
# absent (a missing translation must never suppress an instruction).
locales:
  generic:
    label: "your local emergency number"
    number: null
    instruction: >
      Call your local emergency number or go to the nearest emergency
      department immediately.

  eg:
    label: "123"
    number: "123"
    instruction: "Call 123 (ambulance) or go to the nearest emergency department immediately."
    instruction_ar: "اتصل بالإسعاف على الرقم 123 أو توجه فورًا إلى أقرب قسم طوارئ."
    instruction_fr: "Appelez le 123 (ambulance) ou rendez-vous immédiatement aux urgences les plus proches."

  # us:
  #   label: "911"
  #   number: "911"
  #   instruction: "Call 911 or go to the nearest emergency department immediately."
  # uk:
  #   label: "999"
  #   number: "999"
  #   instruction: "Call 999 or go to the nearest emergency department immediately."

# Copy used when a red flag fires. CRITICAL responses MUST lead with the
# emergency instruction (SAF-6.3) — this is that lead text.
critical_lead: >
  Based on what you have described, this may be a medical emergency.
  Seek emergency care now — do not wait to see whether symptoms improve.

critical_lead_ar: >
  بناءً على ما وصفته، قد تكون هذه حالة طبية طارئة.
  اطلب رعاية طارئة الآن — لا تنتظر لترى ما إذا كانت الأعراض ستتحسن.

high_lead: >
  Based on what you have described, you should be assessed by a healthcare
  professional urgently, today if possible.

high_lead_ar: >
  بناءً على ما وصفته، ينبغي أن يقيّم حالتك مختص رعاية صحية بشكل عاجل،
  اليوم إن أمكن.

critical_lead_fr: >
  D'après ce que vous décrivez, il peut s'agir d'une urgence médicale.
  Consultez en urgence maintenant — n'attendez pas de voir si les
  symptômes s'améliorent.

high_lead_fr: >
  D'après ce que vous décrivez, vous devriez être évalué par un
  professionnel de santé en urgence, aujourd'hui si possible.
