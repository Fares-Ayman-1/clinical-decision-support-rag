# Corpus configuration — the D1 Scope Approval mitigation (ARCHITECTURE.md §5.2).
#
# If mentors require strict 1-2 document compliance at the Day-1 Scope Approval gate,
# set every Tier 2 document's `enabled` to false and re-run scripts/build_index.py.
# No code changes are required. Tier 1 alone must satisfy every acceptance criterion
# in SPEC.md.

kb_version: "1.0"

documents:
  - document_id: who_acs_stroke
    title: "WHO Framework for the Care of Acute Coronary Syndrome and Stroke"
    organization: WHO
    tier: 1
    enabled: true
    file: data/raw/who_acs_stroke.pdf
    domains: [cardiovascular, acs, stroke, emergency]
    heading_profile: config/heading_profiles/who_acs_stroke.yaml
    license: "CC BY-NC-SA 3.0 IGO"
    source_url: "TBD — record exact WHO IRIS URL in docs/knowledge-base.md"
    publication_year: 2018

