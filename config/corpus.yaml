    license: "CC BY-NC-SA 3.0 IGO"
    source_url: "https://iris.who.int/server/api/core/bitstreams/b391d235-448f-4a16-97fc-70a6c0f58870/content"
    publication_year: 2023

  - document_id: who_lbp
    title: "WHO Guideline for Non-Surgical Management of Chronic Primary Low Back Pain in Adults"
    organization: WHO
    tier: 2
    enabled: true
    file: data/raw/who_lbp.pdf
    domains: [musculoskeletal, rehabilitation, general-acute]
    heading_profile: config/heading_profiles/generic.yaml
    license: "CC BY-NC-SA 3.0 IGO"
    source_url: "https://iris.who.int/server/api/core/bitstreams/d3ff33db-d9fd-46a6-8992-e0617d71a5a6/content"
